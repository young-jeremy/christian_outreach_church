{% extends 'base_dashboard.html' %}

{% block content %}
    <div class="container">
        <h2>Update Profile</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'accounts:accounts_settings_and_privacy' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
