<!-- Add this at the top of your template to debug -->
<div class="debug-info" style="display: none;">
    <p>User authenticated: {{ user.is_authenticated }}</p>
    <p>Username: {{ user.username }}</p>
    <p>User ID: {{ user.id }}</p>
</div>

<!-- In your comment form, add the current user info -->
<form class="comment-form mb-4" id="comment-form">
    {% csrf_token %}
    {% if user.is_authenticated %}
        <p class="mb-2">Commenting as: <strong>{{ user.username }}</strong></p>
    {% else %}
        <p class="text-warning">Please <a href="{% url 'login' %}">login</a> to comment</p>
    {% endif %}
    <div class="form-group">
        <textarea class="form-control" rows="3" placeholder="Add a comment..." required></textarea>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Comment</button>
</form>
