{% extends 'base_christian_education.html' %}

{% block content %}
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3>Delete Education Level</h3>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete the education level "{{ object.name }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash"></i> Confirm Delete
                    </button>
                    <a href="{% url 'education:education_level_detail' object.pk %}"
                       class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
