{% extends 'base_dashboard.html' %}
{% load static %}

{% block content %}
    <div class="form-container">
        <div class="form-header">
            <div class="header-content">
                <h1>{{ title|default:"Mission Form" }}</h1>
                <p class="lead">{% if is_edit %}Update mission details{% else %}Create a new mission{% endif %}</p>
            </div>
            {% if is_edit %}
                <div class="header-actions">
                    <a href="{% url 'outreach:mission_detail' object.slug %}" class="btn btn-outline-primary">
                        <i class="fas fa-eye"></i> View Mission
                    </a>
                </div>
            {% endif %}
        </div>

        <div class="form-card">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <!-- Your form fields here -->
                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> {% if is_edit %}Save Changes{% else %}Create Mission{% endif %}
                    </button>
                    <a href="

                            {% if is_edit %}{% url 'outreach:mission_detail' object.slug %}{% else %}{% url 'outreach:mission_list' %}{% endif %}"
                       class="btn btn-outline-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
